plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tradejournal.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.tradejournal.app'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    // Fixed key kept in the repo so every build is signed the same way and installs OVER the previous
    // version without losing your data. Keep the repository private.
    signingConfigs {
        release {
            storeFile file('tradejournal.jks')
            storePassword 'tradejournal'
            keyAlias 'tj'
            keyPassword 'tradejournal'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
